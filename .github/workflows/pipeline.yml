name: pipeline

# 매시 17분에 멀티에이전트 파이프라인을 돌리고, 데이터가 바뀌면 커밋 후 사이트를 다시 배포한다.
# GitHub 예약 실행은 몇 분에서 수십 분 늦어질 수 있다.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 파이프라인 실행
        run: python -m pipeline.run
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LEAGUES: ${{ vars.LEAGUES || 'LCK,Worlds,Mid-Season Invitational' }}
          PANDASCORE_LEAGUE_IDS: ${{ vars.PANDASCORE_LEAGUE_IDS }}

      - name: 바뀐 데이터 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 브리핑 갱신"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN 으로 만든 커밋은 다른 워크플로를 깨우지 않으므로 배포를 직접 호출한다.
  deploy:
    needs: run
    if: needs.run.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
