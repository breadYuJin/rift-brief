# 임시 확인용: 팀 로고와 챔피언 아이콘 수집이 실제로 되는지 본다. 확인 후 지운다.
name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.collect --only logos
        env:
          LOGO_DEBUG: "1"
      - run: cat data/teams.json; cat data/collect.json
