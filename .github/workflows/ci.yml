name: ci

# 코드가 바뀌면 파이프라인(Python)과 사이트(Next.js)를 검사한다.
on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "tests/**"
      - "web/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: 린트·포맷
        run: |
          ruff check .
          ruff format --check .
      - name: 테스트
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: 타입·린트·포맷
        working-directory: web
        run: npm run check
      - name: 빌드
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
