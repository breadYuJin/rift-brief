name: archive

# 사이트 갱신에 필요한 자료를 모두 받아(pipeline/collect.py) data/ 에 저장하고 사이트에 반영한다.
# 하루 네 번 자동으로 돌아 밴픽·세트 상세·선수 기록·타임라인, 챔피언 이름표와 아이콘, 팀 로고,
# (키가 있으면) 공식 채널 영상 목록을 채운다.
# 수동 실행도 되고, 이 파일이 바뀌어도 돈다.
on:
  schedule:
    # GitHub 의 예약 실행은 밀리거나 빠질 수 있어 하루 네 번으로 나눠 둔다(한 번 빠져도 다음 번에 채워진다).
    # 수집은 없는 것만 받으므로 여러 번 돌아도 부담이 작다. 한국 시간 03:23, 06:53, 12:23, 23:53.
    - cron: "23 18 * * *"
    - cron: "53 21 * * *"
    - cron: "23 3 * * *"
    - cron: "53 14 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: 수집할 연도 (비우면 올해)
        default: ""
      timeline_limit:
        description: 이번에 받을 타임라인 수 (세트당 약 5초)
        default: "300"
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive.yml"

permissions:
  contents: write
  issues: read  # 평점 의견 이슈 읽기

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 자료 수집
        run: python -m pipeline.collect ${{ inputs.year && format('--year {0}', inputs.year) || '' }}
        env:
          TIMELINE_LIMIT: ${{ inputs.timeline_limit || '300' }}
          GITHUB_TOKEN: ${{ github.token }}  # 평점 의견 이슈 읽기
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GRID_API_KEY: ${{ secrets.GRID_API_KEY }}
          LOLESPORTS_API_KEY: ${{ secrets.LOLESPORTS_API_KEY }}  # 선택: 팀 로고 목록의 공개 키가 바뀌었을 때만

      - name: 브리핑·전적·분석 생성
        run: python -m pipeline.run
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          HIGHLIGHT_LINKS: ${{ vars.HIGHLIGHT_LINKS }}
          HIGHLIGHT_OFFSET_SEC: ${{ vars.HIGHLIGHT_OFFSET_SEC }}

      - name: 바뀐 데이터 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 시즌 기록 갱신"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
