name: archive

# Leaguepedia 공개 API 에서 올해의 경기 기록을 받아 data/ 에 저장하고 사이트에 반영한다.
# 매일 새벽(한국 시간 03:23)에 자동으로 돌아 전날 경기의 밴픽·세트 상세·선수 기록·타임라인을 채운다.
# 수동 실행도 되고, 이 파일이 바뀌어도 돈다.
on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: 수집할 연도 (비우면 올해)
        default: ""
      timeline_limit:
        description: 이번에 받을 타임라인 수 (세트당 약 5초)
        default: "150"
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive.yml"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install langgraph langchain pydantic requests

      - name: 시즌 기록 수집
        run: python -m pipeline.leaguepedia ${{ inputs.year && format('--year {0}', inputs.year) || '' }} --timeline-limit "${{ inputs.timeline_limit || '150' }}"

      - name: 브리핑·전적 생성
        run: python -m pipeline.run
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}

      - name: 바뀐 데이터 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 시즌 기록 갱신"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
