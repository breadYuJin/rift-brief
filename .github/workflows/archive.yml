name: archive

# Leaguepedia 공개 API 에서 한 해의 경기 기록을 받아 data/archive/ 에 저장하고 사이트에 반영한다.
# 수동 실행하거나, 수집 스크립트·이 파일이 바뀌면 자동으로 돈다.
on:
  workflow_dispatch:
    inputs:
      year:
        description: 수집할 연도
        default: "2026"
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive.yml"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install langgraph langchain pydantic requests

      - name: 시즌 기록 수집
        run: python -m pipeline.leaguepedia --year "${{ inputs.year || '2026' }}"

      - name: 브리핑·전적 생성
        run: python -m pipeline.run
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}

      - name: 바뀐 데이터 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 시즌 기록 갱신"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
