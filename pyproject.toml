# 파이프라인(Python) 코드 규칙. 실행: ruff check . && ruff format --check .
[project]
name = "rift-brief"
version = "0.1.0"
description = "LoL e스포츠 경기 브리핑과 밴픽 예측을 만드는 멀티 에이전트 파이프라인"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
  "E", "W", "F",  # 기본 오류·경고
  "I",            # import 정렬
  "B",            # 흔한 실수
  "UP",           # 최신 문법
  "SIM", "C4", "PIE", "RET", "PERF",  # 군더더기
  "RUF",
]
ignore = [
  # 한국어 문서·정규식에서 일부러 쓰는 전각 콜론, 곱하기·빼기 기호
  "RUF001", "RUF002", "RUF003",
  # 반복문 안의 try 는 수집 실패를 건별로 넘기기 위한 것
  "PERF203",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
